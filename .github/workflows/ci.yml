name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          retention-days: 14

      # Only the Node 20 leg comments, and only for PRs from this repository:
      # fork PRs get a read-only token, so posting would fail.
      - name: Comment coverage summary on PR
        if: >-
          github.event_name == 'pull_request' &&
          matrix.node == 20 &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          NODE_VERSION: ${{ matrix.node }}
          COVERAGE_THRESHOLDS: lines 90 / statements 90 / functions 90 / branches 80
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- coverage-report -->';
            const summaryPath = 'coverage/coverage-summary.json';

            if (!fs.existsSync(summaryPath)) {
              core.warning(`No coverage summary at ${summaryPath}; skipping PR comment.`);
              return;
            }

            const { total } = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const row = (label, metric) =>
              `| ${label} | ${metric.covered} / ${metric.total} | ${metric.pct.toFixed(2)}% |`;

            const body = [
              marker,
              '## Coverage report',
              '',
              '| Metric | Covered | % |',
              '| --- | --- | --- |',
              row('Lines', total.lines),
              row('Statements', total.statements),
              row('Functions', total.functions),
              row('Branches', total.branches),
              '',
              `Gate (\`src/\`): ${process.env.COVERAGE_THRESHOLDS}.`,
              `Node ${process.env.NODE_VERSION} · full report in the \`coverage-node-${process.env.NODE_VERSION}\` artifact.`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated coverage comment ${existing.id}.`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Created coverage comment.');
            }

  # Only the lines a PR adds or changes have to be tested; untouched legacy
  # code cannot drag a pull request down.
  diff-coverage:
    name: diff coverage (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The merge base with the base branch must be available locally.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Diff coverage for changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          python3 -m venv "$RUNNER_TEMP/diff-cover-venv"
          "$RUNNER_TEMP/diff-cover-venv/bin/pip" install --quiet diff-cover
          "$RUNNER_TEMP/diff-cover-venv/bin/diff-cover" coverage/lcov.info \
            --compare-branch "origin/$BASE_REF" \
            --fail-under=90 \
            --format markdown:diff-coverage.md
          status=$?
          if [ -f diff-coverage.md ]; then
            cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
